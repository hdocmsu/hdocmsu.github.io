<!-- <hr style="width:100%;text-align:left;margin-left:0"> -->
<div class="card_for_cv" style="padding: 0.75rem; margin-top: 1rem; margin-bottom: 1rem; text-align: center;">   
<div style="margin-top: 1rem; margin-bottom: 2rem;">
  <center>
    <p style="margin-bottom: 0.5rem;"><strong>Get future posts delivered to your inbox.</strong> <br/> <normal style="font-size: 1.0rem; color: var(--global-post-description-color);">Occasional emails. No noise. Unsubscribe anytime.</normal></p>
    <div style="background-color: var(--global-bg-color); padding: 1.5rem; max-width: 450px; margin: 0 auto; border: 1px solid var(--global-divider-color); border-radius: 5px;">
        <form action="https://{{ site.substack_username }}.substack.com/api/v1/free?nojs=true" method="post" style="margin: 0.0rem; margin-bottom: 1.0rem;">
        <input type="email" name="email" placeholder="Enter your email" required 
               style="width: 100%; padding: 0.75rem; margin-bottom: 0.75rem; border: 1px solid var(--global-divider-color); border-radius: 4px; background-color: var(--global-bg-color); color: var(--global-text-color); font-size: 1rem;">
        <button type="submit" 
                style="width: 100%; padding: 0.75rem; background-color: var(--global-theme-color); color: rgb(0, 0, 0); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem;">
          Subscribe
        </button>
      </form>
      
    </div>
  </center>
</div>
</div>
