{% if site.enable_math %}
<!-- MathJax -->
<script type="text/javascript">
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      tags: 'ams'
    },
    chtml: {
      linebreaks: {
        automatic: true,   // try wrapping long display equations automatically
        width: 'container'
      }
    }
  };
</script>

<style>
  /* Global fallback for all display equations */
  mjx-container[display="true"] {
    max-width: 100%;
    overflow-x: auto;      /* if wrapping still cannot occur, allow scroll */
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 0.15rem;
  }
</style>

<script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@{{ site.mathjax.version }}/es5/tex-mml-chtml.js"></script>
<script defer src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
{% endif %}
