<div class="card_for_cv" style="padding: 0.75rem; margin-top: 1rem; margin-bottom: 1rem; text-align: center;">  
<h2 id="comments-and-feedback" style="text-align: center; margin-top: 1rem; margin-bottom: 0.5rem; color: var(--global-heading-color)">What do you think?</h2>
<p style="text-align: center; margin-bottom: 0rem;">Logging in allows you to track and manage your comments. <br/>Otherwise, enter a <strong>random name</strong> and a <strong>random email</strong> to comment as a guest.</p>
<!-- <br /> -->
<div id="disqus_thread" style="max-width: {{ site.max_width }}; margin: 0 auto;">
  <script type="text/javascript">
    var disqus_shortname  = '{{ site.disqus_shortname }}';
    var disqus_identifier = '{{ page.id }}';
    var disqus_title      = {{ page.title | jsonify }};
    (function() {
    var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
    dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
    (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
    })();
  </script>
  <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</div>
</div>
