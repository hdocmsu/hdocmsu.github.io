---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-description" style="font-size: 1.0rem; color: #98C8C8;">{{ page.description }}</p>
  </header>

  <article>
    {{ content }}

  </article>

  <!-- Substack Subscribe -->
  {% if page.substack %}
    <center> 
      {% include substack.html %}
    </center>
  {% endif %}

  {% if page.social %}
    <div class="social">
      <div class="contact-icons">
        {% include social.html %}
      </div>
      <div class="contact-note">{{ site.contact_note }}</div>
    </div>
  {% endif %}
    
</div>
